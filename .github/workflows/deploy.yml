name: Check and deploy

# `static` and `e2e` together run the full `npm run verify` (type check, ESLint,
# Vitest, content validation, baseline comparisons, build, bundle budget,
# Playwright) on every pull request and every push to main, split into parallel
# jobs. The site deploys only when all of them pass.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run that may deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Content build, type check, ESLint, Vitest, the chat index check, baseline comparisons, the test build
  # and the bundle budget. Runs in parallel with the browser jobs below.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm run verify (static steps and build)
        run: npm run verify -- --only=content,tsc,eslint,vitest,chatindex,snapshot,behavior,build,bundle

  # Playwright against the test build: Chromium features, the WebKit/Firefox phone
  # smoke tests, and the visual snapshots. Each job makes its own test build (about
  # 30 s; dist/ holds 420 MB of narration audio, slower to pass between jobs).
  # Pull requests run the Badr replay only (REPLAYS=badr); pushes to main run all 12.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - step: features
            browsers: chromium
          - step: engines
            browsers: webkit firefox
          - step: visual
            browsers: chromium
    env:
      REPLAYS: ${{ github.event_name == 'pull_request' && 'badr' || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: npm run verify (test build and ${{ matrix.step }})
        run: npm run verify -- --only=content,build,${{ matrix.step }}

      # While no Linux reference screenshots and UI numbers are committed, verify
      # records them instead of comparing; they are uploaded here for review.
      - name: Upload Linux baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-linux-${{ matrix.step }}
          path: |
            tests/baseline/visual/**/*-linux.png
            tests/baseline/behavior-ui-linux.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.step }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    needs: [static, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public URL of the chat backend, deployed as its own Vercel
          # project (api/). Not a secret — just an endpoint address; the
          # actual LLM API keys live server-side, only in Vercel's env vars.
          VITE_CHAT_API_URL: https://nibras-chat-api.vercel.app/api/chat
          # Sentry crash reporting (docs/OWNER_DASHBOARD.md). The DSN is public by
          # design; the auth token (secret) uploads source maps for this release.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
